global:
  scrape_interval: 15s
  evaluation_interval: 15s

  external_labels:
    monitor: "docker-compose-monitor"

# 采集配置
scrape_configs:
  # 采集 Prometheus 自身指标
  - job_name: "prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["localhost:9090"]

  # 采集 vLLM 指标
  - job_name: "inference-engine"
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
        - "172.20.0.1:8000"
