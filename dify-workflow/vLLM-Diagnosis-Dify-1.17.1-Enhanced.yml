          status\", \"unknown\"), \"unknown\")\n    alert_status = _text(alert.get(\"status\", group_status), group_status)\n    receiver = _text(body.get(\"receiver\", \"\"))\n    alert_name = _text(labels.get(\"alertname\", \"unknown\"), \"unknown\")\n    severity = _text(labels.get(\"severity\", \"unknown\"), \"unknown\")\n    instance = _text(labels.get(\"instance\", \"unknown\"), \"unknown\")\n    job = _text(labels.get(\"job\", \"unknown\"), \"unknown\")\n    service = _text(labels.get(\"service\", labels.get(\"app\", \"\")))\n    layer = _text(labels.get(\"layer\", labels.get(\"component\", \"\")))\n    namespace = _text(labels.get(\"namespace\", \"\"))\n    pod = _text(labels.get(\"pod\", \"\"))\n    model = _text(labels.get(\"model\", labels.get(\"served_model_name\", \"\")))\n    summary = _text(annotations.get(\"summary\", \"\"))\n    description = _text(annotations.get(\"description\", \"\"))\n    runbook_hint = _text(annotations.get(\"runbook_hint\", labels.get(\"runbook_hint\"\
          , \"\")))\n    starts_at = _text(alert.get(\"startsAt\", \"\"))\n    ends_at = _text(alert.get(\"endsAt\", \"\"))\n    generator_url = _text(alert.get(\"generatorURL\", \"\"))\n    fingerprint = _text(alert.get(\"fingerprint\", \"\"))\n\n    alert_text = \"\\n\".join([\n        f\"AlertName: {alert_name}\", f\"GroupStatus: {group_status}\",\n        f\"AlertStatus: {alert_status}\", f\"Severity: {severity}\",\n        f\"Instance: {instance}\", f\"Job: {job}\", f\"Service: {service}\",\n        f\"Layer: {layer}\", f\"Namespace: {namespace}\", f\"Pod: {pod}\",\n        f\"Model: {model}\", f\"Summary: {summary}\",\n        f\"Description: {description}\", f\"RunbookHint: {runbook_hint}\",\n        f\"StartsAt: {starts_at}\", f\"EndsAt: {ends_at}\",\n        f\"GeneratorURL: {generator_url}\", f\"Fingerprint: {fingerprint}\"\n    ])\n\n    hint_anchor = f\"Runbook §{runbook_hint}\" if runbook_hint else \"Runbook 章节未知\"\n    rag_query = \"\\n\".join([\n        \"请检索与以下单条推理平台告警最相关的诊断知识：\"\
