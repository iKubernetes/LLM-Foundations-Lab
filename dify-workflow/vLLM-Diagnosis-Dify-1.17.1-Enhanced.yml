            请遵循以下步骤：


            1. 先阅读检索结果，结合 alert_name 与 runbook_hint 定位最相关的 Runbook 条目；提取告警含义、阈值、诊断顺序、推荐指标/PromQL、关联告警和历史模式。

            2. Runbook 只作为诊断方法和假设来源，不得作为本次故障已经发生的事实。

            3. 形成 1～3 个最相关假设 H1/H2/H3，并确定验证每个假设所需的最小实时证据。

            4. 使用 list_targets 核对告警 instance/job 对应的监控目标及标签一致性。

            5. 使用 query 查询当前值；性能类告警按需使用 range_query，窗口尽量覆盖 StartsAt 前 5 分钟至后 10 分钟。当前仍 firing 时，可补查最近 5～10 分钟。

            6. 根据真实 Tool Result 将假设标为“支持 / 不支持 / 未验证”，并区分告警触发时状态与当前状态。

            7. 若知识库未命中、检索结果不相关、PromQL 无数据或证据不足，明确指出，不得猜测或补造。

            8. 原则上调用 2～8 次 Prometheus 工具，硬上限 10 次；达到停止条件后按系统规定结构输出。

            9. 只做查询和诊断，不执行 Runbook 中的修复、重启、扩缩容或配置变更。'
