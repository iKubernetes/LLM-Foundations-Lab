          import json

          def main(payload: dict) -> dict:
              body = payload.get("body", {}) or {}
              alerts = body.get("alerts", []) or []
              normalized = []

              for index, alert in enumerate(alerts):
                  labels = alert.get("labels", {}) or {}
                  annotations = alert.get("annotations", {}) or {}
                  normalized.append({
                      "index": index,
                      "alertname": labels.get("alertname", "unknown"),
                      "status": alert.get("status", "unknown"),
                      "severity": labels.get("severity", "unknown"),
                      "instance": labels.get("instance", "unknown"),
                      "job": labels.get("job", "unknown"),
                      "startsAt": alert.get("startsAt", ""),
                      "endsAt": alert.get("endsAt", ""),
                      "summary": annotations.get("summary", ""),
                      "description": annotations.get("description", ""),
                      "generatorURL": alert.get("generatorURL", ""),
                      "labels": labels,
                      "annotations": annotations,
                  })

              firing_alerts = [item for item in normalized if item["status"] == "firing"]
              resolved_alerts = [item for item in normalized if item["status"] == "resolved"]

              # 按 job + instance 分组，避免不同监控对象的告警在一次诊断中相互串联。
              groups = {}
              for item in firing_alerts:
                  key = f'{item["job"]}::{item["instance"]}'
                  groups.setdefault(key, {
                      "group_key": key,
                      "job": item["job"],
                      "instance": item["instance"],
                      "alerts": [],
                  })["alerts"].append(item)

              diagnosis_groups = list(groups.values())
              diagnosis_group_items = [
                  json.dumps(group, ensure_ascii=False) for group in diagnosis_groups
              ]
              primary = firing_alerts[0] if firing_alerts else {}
              alert_texts = []
              for item in firing_alerts:
                  alert_texts.append("\n".join([
                      f'AlertName: {item["alertname"]}',
                      f'Status: {item["status"]}',
                      f'Severity: {item["severity"]}',
                      f'Instance: {item["instance"]}',
                      f'Job: {item["job"]}',
                      f'Summary: {item["summary"]}',
                      f'Description: {item["description"]}',
                      f'StartsAt: {item["startsAt"]}',
                      f'GeneratorURL: {item["generatorURL"]}',
                  ]))

              return {
                  "status": "firing" if firing_alerts else "resolved",
                  "has_firing": bool(firing_alerts),
                  "receiver": body.get("receiver", ""),
                  "alert_count": len(normalized),
                  "firing_alert_count": len(firing_alerts),
                  "resolved_alert_count": len(resolved_alerts),
                  "alert_text": "\n\n---\n\n".join(alert_texts),
                  "alerts_json": json.dumps(normalized, ensure_ascii=False),
                  "diagnosis_groups": diagnosis_group_items,
                  "diagnosis_groups_json": json.dumps(diagnosis_groups, ensure_ascii=False),
                  "primary_alert_name": primary.get("alertname", ""),
                  "primary_instance": primary.get("instance", ""),
                  "primary_job": primary.get("job", ""),
                  "primary_starts_at": primary.get("startsAt", ""),
                  "skip_message": "No firing alerts. Diagnosis skipped.",
              }
