model_list:
  # 1. 主力模型组：qwen3.5
  - model_name: qwen3.5
    litellm_params:
      model: openai/qwen3.5
      api_base: http://172.29.0.165:8000/v1
      api_key: EMPTY
      input_cost_per_token: 0.0000028  # 2.8 / 1M tokens
      output_cost_per_token: 0.0000058
      rpm: 300
      tpm: 12000
    weight: 0.6
    priority: 100
    metadata:
      region: cn-south-1

  - model_name: qwen3
    litellm_params:
      model: openai/qwen3.5
      api_base: http://172.29.0.165:8001/v1
      api_key: EMPTY
      input_cost_per_token: 0.0000018  # 2.8 / 1M tokens
      output_cost_per_token: 0.0000038
      rpm: 200
      tpm: 2000
    weight: 0.4
    priority: 100
    metadata:
      region: cn-north-1

# Router 终极容错配置
router_settings:
  # 1. 负载均衡策略：先成本最低，再最闲
  routing_strategy: cost-based-routing     # 第一优先成本，其次 least-busy
  # 如果更在乎延迟，可改成：least-busy

  # 2. 重试机制：429 多试几次，其他错误少打扰
  num_retries: 3
  fallback_retries: true                   # 备用模型也重试
  retry_policy:
    RateLimitErrorRetries: 5              # 429 最多再试 5 次
    InternalServerErrorRetries: 3
    TimeoutErrorRetries: 4

  # 3. 冷却机制：瞬时故障 5 秒，持续故障 2 分钟
  allowed_fails: 6                         # 60 秒内失败 6 次才长冷却
  cooldown_time: 120                       # 严重故障冷却 2 分钟
  # 429 自动 5 秒轻量冷却由系统内置，无需配置

  # 4. Fallback 顺序
  fallbacks:
  - {"qwen3.5": ["qwen3"]}
  #- {"qwen3": ["llama3"]}

  # 5. 全局兜底
  default_fallbacks: ["qwen3"]

  # 6. 上下文超长自动切大模型
  litellm_settings:
    context_window_fallbacks:
      - from_model: qwen3.5
        to_model: ["qwen3"]         # 上下文不够直接切 qwen3