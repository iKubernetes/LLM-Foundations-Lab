# LiteLLM Proxy

model_list:
  # 1. 主推理模型 (Qwen3-8B)
  - model_name: qwen3
    litellm_params:
      model: openai/qwen3
      #api_base: https://u492360-ac4b-dafc1fae.westc.seetacloud.com:8443/v1
      api_base: http://172.21.0.1:8000/v1
      api_key: "EMPTY"
    model_info:
      max_tokens: 16384

general_settings:
  disable_key_management: true
  return_openai_object: true
  #disable_spend_logs: true
  #store_model_in_db: false

  proxy_batch_write_at: 60 # Batch write spend updates every 60s

# 精确缓存（Redis DB 0）
litellm_settings:
  set_verbose: True
  cache: true  # set cache responses to True, litellm defaults to using a redis cache
  cache_params:
    type: "redis"
    max_connections: 100
    supported_call_types: ["acompletion", "atext_completion", "aembedding", "atranscription"]
                      # /chat/completions, /completions, /embeddings, /audio/transcriptions

    # Redis cache parameters
    host: redis-cache  # Redis server hostname or IP address
    port: "6379"  # Redis server port (as a string)
    password: magedu.com  # Redis server password    

cache:
  type: redis
  ttl: 7200  # 缓存过期时间，单位秒

# 日志
logging:
  level: INFO
  log_file: /app/logs/litellm.log
